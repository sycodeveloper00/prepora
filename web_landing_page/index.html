<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrePora</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0A0E1A;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff}
    .c{text-align:center;padding:32px}
    .e{font-size:48px;color:#EF5350;margin-bottom:12px}
    .t{font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:16px}
    a{color:#00B8D4;text-decoration:none;font-size:14px}
    .loading{font-size:13px;color:rgba(255,255,255,0.3)}
  </style>
</head>
<body>
  <div class="c" id="loading"><p class="loading">Opening PrePora...</p></div>
  <div class="c" id="error" style="display:none">
    <div class="e">&#9888;</div>
    <p class="t">App not found. Install PrePora to open this link.</p>
    <a href="https://play.google.com/store/apps/details?id=com.prepora.academy.prepora">Install from Play Store</a>
  </div>
  <script>
    (function(){
      var path = window.location.pathname + window.location.search;
      var deepLink = 'prepora://' + path.replace(/^\//,'');
      var opened = false;
      window.addEventListener('blur', function(){ opened = true; });
      window.location.href = deepLink;
      setTimeout(function(){
        if(!opened){
          document.getElementById('loading').style.display='none';
          document.getElementById('error').style.display='block';
        }
      }, 2000);
    })();
  </script>
</body>
</html>
